<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>景区游览地图</title>
<style>
  :root { --ink:#3a3633; --sub:#8a7f77; --terra:#b45f45; --paper:#faf7f2; --card:#ffffff; --line:#e8e1d8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; }
  .wrap { max-width:720px; margin:0 auto; padding:32px 20px 48px; }
  header h1 { font-size:22px; font-weight:600; letter-spacing:.02em; }
  header p { margin-top:8px; font-size:14px; color:var(--sub); line-height:1.6; }
  ul.maps { list-style:none; margin-top:24px; display:grid; gap:12px; }
  ul.maps a { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; text-decoration:none; color:var(--ink); transition:border-color .15s; }
  ul.maps a:hover { border-color:var(--terra); }
  ul.maps .name { font-size:16px; font-weight:600; }
  ul.maps .meta { margin-top:4px; font-size:13px; color:var(--sub); }
  ul.maps .meta .dot { margin:0 6px; color:var(--line); }
  .empty { margin-top:24px; background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:32px 20px; text-align:center; font-size:14px; color:var(--sub); line-height:1.8; }
  footer { margin-top:40px; font-size:12px; color:var(--sub); line-height:1.7; border-top:1px solid var(--line); padding-top:16px; }
  footer a { color:var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>景区游览地图</h1>
    <p>基于 OpenStreetMap 开放数据生成的手机友好交互式游览地图，由 plan-scenic-route 技能生成并托管于 GitHub Pages。</p>
  </header>
  <ul class="maps">
    <!-- 新地图在此列表顶部追加：<li><a href="maps/<slug>/">名称</a></li> -->
  </ul>
  <div class="empty">还没有地图。<br>生成新的景区游览地图后，会自动出现在这里。</div>
  <footer>
    地图数据 © OpenStreetMap 贡献者（<a href="https://www.openstreetmap.org/copyright">ODbL</a>）·
    页面由 <a href="https://github.com/InsiderF/scenic-maps">InsiderF/scenic-maps</a> 托管
  </footer>
</div>
</body>
</html>
